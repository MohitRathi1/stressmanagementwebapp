<script>
// ── QUESTION DATA ──
const QS=[
{tag:'Introduction',tc:'#60a5fa',title:'Stress & Its Major Theories',q:'Explain the meaning of stress and discuss the major stress theories with suitable examples.',ans:`
<h4>What is Stress?</h4>
<p>Stress is your body's physical and emotional response to demands, threats, or challenges — a state of tension when you feel you cannot cope with a situation.</p>
<h4>Fight-or-Flight Theory <span class="hl">Walter Cannon</span></h4>
<p>When you face danger, your body instantly prepares to fight it or run away. Heart rate spikes, adrenaline floods in. <em>Example: Heart pounding when a dog suddenly barks at you.</em></p>
<h4>General Adaptation Syndrome <span class="hl">Hans Selye</span></h4>
<p>Stress unfolds in 3 stages:</p>
<ul><li><strong>Alarm</strong> — Body detects threat; adrenaline surges</li><li><strong>Resistance</strong> — Body tries to cope and adapt</li><li><strong>Exhaustion</strong> — Body collapses if stress is prolonged</li></ul>
<p><em>Example: Weeks of exam stress leading to falling sick.</em></p>
<h4>Cognitive Appraisal Theory <span class="hl">Lazarus & Folkman</span></h4>
<p>Stress depends on how YOU see a situation. If you think you can't cope → stress. Same event affects different people differently. Public speaking feels terrifying to one person, exciting to another.</p>
<h4>Person-Environment Fit Theory</h4>
<p>Stress occurs when there's a mismatch between your abilities and your environment's demands. <em>Example: A quiet, introverted person placed in an aggressive sales job.</em></p>`},

{tag:'Biology',tc:'#a78bfa',title:'Brain, Endocrine & Nervous System in Stress',q:'Describe the role of the brain, endocrine system, and autonomic nervous system in stress response.',ans:`
<h4>The Brain</h4>
<ul><li><span class="hl">Amygdala</span> — Detects the threat and sends an alarm signal instantly</li><li><span class="hl">Hypothalamus</span> — Command center; triggers the hormonal and nervous response</li><li><span class="hl">Prefrontal Cortex</span> — Tries to reason and regulate emotions (often overridden during acute stress)</li></ul>
<h4>Endocrine System — Stress Hormones</h4>
<ul><li><strong>Adrenaline (Epinephrine)</strong> — Instant energy, faster heartbeat</li><li><strong>Cortisol</strong> — Sustains the stress response, raises blood sugar for fuel</li><li><strong>Norepinephrine</strong> — Boosts alertness and focus</li></ul>
<h4>Autonomic Nervous System (ANS)</h4>
<ul><li><span class="hl">Sympathetic branch</span> — "Fight or Flight": speeds heart, dilates pupils, stops digestion, raises breathing rate</li><li><span class="hl">Parasympathetic branch</span> — "Rest and Digest": calms the body after the threat passes</li></ul>
<p>All three systems work together: brain detects danger → endocrine system floods hormones → ANS activates the physical stress response → body is ready to act.</p>`},

{tag:'Body Effects',tc:'#f87171',title:'Stress Effects on Body Systems',q:'Explain the effects of stress on the cardiovascular system, gastrointestinal system, muscles, and skin.',ans:`
<h4>Cardiovascular System</h4>
<p>Stress causes faster heartbeat, higher blood pressure, and constricted blood vessels. Chronic stress significantly increases the risk of <span class="hl">heart attacks</span>, <span class="hl">strokes</span>, and <span class="hl">hypertension</span>.</p>
<h4>Gastrointestinal System</h4>
<p>The gut has its own nervous system deeply connected to the brain. Stress disrupts digestion causing:</p>
<ul><li>Nausea, stomach cramps, diarrhea, constipation</li><li>Peptic ulcers from excess stomach acid</li><li>Irritable Bowel Syndrome (IBS)</li></ul>
<h4>Muscles</h4>
<p>Muscles tighten involuntarily during stress as the body prepares to fight or flee. Chronic tension causes:</p>
<ul><li>Tension headaches and migraines</li><li>Neck, shoulder, and back pain</li><li>Jaw clenching (bruxism) during sleep</li></ul>
<h4>Skin</h4>
<ul><li>Acne breakouts (cortisol → more oil production)</li><li>Eczema, psoriasis, and hives worsen</li><li>Delayed wound healing</li><li>Hair loss (telogen effluvium)</li></ul>`},

{tag:'Symptoms',tc:'#4ade80',title:'Symptoms of Stress & Psychosomatic Diseases',q:'Discuss the symptoms of stress and explain the relationship between stress and psychosomatic diseases.',ans:`
<h4>Physical Symptoms</h4>
<ul><li>Headaches, fatigue, chest tightness, rapid heartbeat</li><li>Digestive upset, loss of appetite or overeating</li><li>Sleep problems — insomnia or oversleeping</li></ul>
<h4>Emotional Symptoms</h4>
<ul><li>Anxiety, irritability, mood swings</li><li>Feeling overwhelmed, helpless, or depressed</li></ul>
<h4>Cognitive Symptoms</h4>
<ul><li>Forgetfulness, poor concentration, indecisiveness</li><li>Constant worrying and negative thinking</li></ul>
<h4>Behavioral Symptoms</h4>
<ul><li>Social withdrawal, avoiding responsibilities</li><li>Increased alcohol, smoking, or drug use</li><li>Procrastination, neglecting self-care</li></ul>
<h4>Psychosomatic Diseases</h4>
<p>Real physical illnesses caused or worsened by mental and emotional stress. The mind directly affects the body:</p>
<ul><li>Stress → High blood pressure</li><li>Stress → Asthma attacks triggered or worsened</li><li>Stress → Peptic ulcers</li><li>Stress → Migraines &amp; Irritable Bowel Syndrome (IBS)</li></ul>
<p>The connection is biological — emotions activate hormones that alter organ function.</p>`},

{tag:'PTSD & Immunity',tc:'#818cf8',title:'PTSD, Immune System & Serum Cholesterol',q:'Explain Posttraumatic Stress Disorder (PTSD) and describe how stress affects the immune system and serum cholesterol.',ans:`
<h4>PTSD — Post-Traumatic Stress Disorder</h4>
<p>Develops after experiencing a deeply traumatic event. The brain gets "stuck" in survival mode.</p>
<p><strong>Who gets it?</strong> War veterans, accident survivors, abuse victims, disaster survivors.</p>
<ul><li>Flashbacks and nightmares</li><li>Emotional numbness and detachment</li><li>Hypervigilance — always on edge, startled easily</li><li>Avoiding triggers related to the trauma</li><li>Depression, anger, guilt, shame</li></ul>
<h4>Stress & the Immune System</h4>
<p>Cortisol suppresses immune function — the body can't fight disease while in survival mode:</p>
<ul><li>More frequent infections and colds</li><li>Wounds heal more slowly</li><li>Autoimmune diseases flare up</li><li>Vaccines may be less effective under chronic stress</li></ul>
<h4>Stress & Serum Cholesterol</h4>
<p>Stress hormones trigger the liver to release more fats into blood:</p>
<ul><li>LDL ("bad") cholesterol rises</li><li>HDL ("good") cholesterol falls</li><li>Triglycerides increase</li><li>Long-term risk of heart disease and atherosclerosis</li></ul>`},

{tag:'College Life',tc:'#fbbf24',title:'Stress Sources in College Students',q:'Describe the different sources of stress among younger and older college students with suitable examples.',ans:`
<h4>Younger College Students (18–22 yrs)</h4>
<p>Identity-related stress and life transitions:</p>
<ul><li><strong>Leaving home</strong> — Homesickness, loneliness, first independence</li><li><strong>Social pressure</strong> — Making friends, fitting in, peer pressure</li><li><strong>Romantic relationships</strong> — First relationships, heartbreaks, rejection</li><li><strong>Academic pressure</strong> — Exams, assignments, competitive grades</li><li><strong>Financial dependence</strong> — Limited money, relying on parents</li><li><strong>Identity questions</strong> — "Who am I? What's my career path?"</li></ul>
<p><em>Example: A fresher moving from a small town to a city college struggles with loneliness and exam fear.</em></p>
<h4>Older College Students (25+ yrs)</h4>
<p>Multi-role complex stress — managing work, family, and studies simultaneously:</p>
<ul><li><strong>Work-family-study balance</strong> — Three demanding roles at once</li><li><strong>Financial stress</strong> — Paying tuition + bills + family costs</li><li><strong>Feeling out of place</strong> — Among much younger classmates</li><li><strong>Time pressure</strong> — Never enough hours in the day</li><li><strong>Career anxiety</strong> — Fear of change, job insecurity</li><li><strong>Family obligations</strong> — Children, elderly parents, spouse</li></ul>
<p><em>Example: A 32-year-old mother studying nursing part-time while working and raising two children.</em></p>`},

{tag:'Coping',tc:'#86efac',title:'Coping Strategies & the Power of Eustress',q:'Explain coping strategies for stress management and discuss the importance of eustress in life.',ans:`
<h4>Problem-Focused Coping</h4>
<p>Directly tackle the problem when you CAN control the situation. Make a plan and act on it. <em>Example: Overwhelmed by exams → create a timetable, study in chunks, ask for help.</em></p>
<h4>Emotion-Focused Coping</h4>
<p>Manage your emotional reaction when you CANNOT control the situation. <em>Example: Grieving a loss → talk to a friend, journal feelings, seek counseling.</em></p>
<h4>Social Support Coping</h4>
<p>Reach out to trusted people — friends, family, mentors, support groups. Feeling heard dramatically reduces cortisol levels.</p>
<h4>Relaxation-Based Coping</h4>
<p>Yoga, meditation, deep breathing, exercise — all reduce cortisol and restore calm to the nervous system.</p>
<h4>Avoidance Coping (Unhealthy)</h4>
<p>Ignoring or denying the problem. Short-term relief only — long-term it worsens stress. <em>Example: Binge-watching instead of preparing for a deadline.</em></p>
<h4>Eustress — The Good Stress!</h4>
<p>Not all stress is harmful. <span class="hl">Eustress</span> is positive, motivating stress that:</p>
<ul><li>Pushes you to perform at your best</li><li>Creates excitement, drive, and a sense of purpose</li><li>Builds confidence and resilience over time</li></ul>
<p><em>Examples: Excitement before a performance, the drive to win a match, the thrill of starting a new job, the motivation of a healthy deadline.</em></p>`},

{tag:'Lifestyle',tc:'#fb923c',title:'Nutrition, Noise, Life Events & Chronic Stress',q:'Discuss the relationship between nutrition, noise, life events, hassles, and chronic stress.',ans:`
<h4>Nutrition & Stress</h4>
<ul><li><strong>Poor diet</strong> (sugar, caffeine, junk food) increases stress sensitivity and cortisol</li><li><strong>Deficiencies</strong> in magnesium, B vitamins, omega-3s worsen anxiety</li><li><strong>Good nutrition</strong> — whole grains, fruits, vegetables, protein supports stress resilience</li><li>Stress-eating creates a harmful cycle that worsens both health and stress</li></ul>
<h4>Noise as a Stressor</h4>
<p>Chronic noise (traffic, construction, loud offices) elevates cortisol and blood pressure. Even background office noise reduces concentration and increases irritability and fatigue.</p>
<h4>Life Events</h4>
<p>Major life changes are powerful stressors — even positive ones. The <span class="hl">Holmes & Rahe Stress Scale</span> ranks them: death of a spouse (most stressful), divorce, job loss, marriage, moving house.</p>
<h4>Daily Hassles</h4>
<p>Small daily irritants accumulate: traffic jams, misplacing keys, long queues, rude people. Research shows daily hassles can be more harmful than major life events because they are constant and inescapable.</p>
<h4>Chronic Stress</h4>
<p>Long-lasting stress (poverty, abusive relationships, demanding jobs) that never fully resolves. The most damaging form — it keeps cortisol elevated, suppresses immunity, and wears the body and mind down over time.</p>`},

{tag:'Communication',tc:'#f9a8d4',title:'Communication, Conflict Resolution & Emotional Intelligence',q:'Explain the importance of communication, conflict resolution, and emotional intelligence in stress management.',ans:`
<h4>Communication & Stress</h4>
<ul><li><span class="hl">Assertive communication</span> — Express yourself calmly and clearly, neither passive nor aggressive</li><li><span class="hl">Active listening</span> — Fully focus on the speaker; don't just wait for your turn</li><li><span class="hl">Non-verbal cues</span> — Body language, tone, and eye contact communicate as much as words</li></ul>
<h4>Conflict Resolution</h4>
<p>Unresolved conflict is a chronic stressor. Healthy resolution steps:</p>
<ul><li>Stay calm — take a break if emotions are too high</li><li>Identify the REAL problem, not just the symptoms</li><li>Focus on the issue, not the person — no blame</li><li>Seek win-win solutions</li><li>Practice forgiveness and move forward</li></ul>
<h4>Emotional Intelligence (EI) — Goleman's 5 Components</h4>
<p>High EI people handle stress far better:</p>
<ul><li><strong>Self-awareness</strong> — Knowing your emotions and triggers</li><li><strong>Self-regulation</strong> — Controlling reactions, not being impulsive</li><li><strong>Motivation</strong> — Internal drive and resilience</li><li><strong>Empathy</strong> — Understanding and feeling others' emotions</li><li><strong>Social skills</strong> — Managing relationships effectively</li></ul>`},

{tag:'Technology & Time',tc:'#22d3ee',title:'Techno-Stress, Time Management & Social Support',q:'Describe the concept of techno-stress and explain the role of time management and social support networking in reducing stress.',ans:`
<h4>Techno-Stress</h4>
<p>Stress caused by technology and being constantly connected:</p>
<ul><li><strong>Always-on culture</strong> — Work emails at midnight, no true "off" time</li><li><strong>Information overload</strong> — Too many notifications, news, social media</li><li><strong>FOMO</strong> — Fear of missing out from constant social comparison</li><li><strong>Cyberbullying</strong> — Online harassment causing anxiety and depression</li><li><strong>Screen fatigue</strong> — Eye strain, disrupted sleep from blue light</li></ul>
<h4>Time Management for Stress Reduction</h4>
<ul><li>Prioritize with the <span class="hl">Eisenhower Matrix</span> (urgent vs. important)</li><li>Break large tasks into small, actionable steps</li><li>Avoid procrastination — start with the hardest task first</li><li>Schedule buffer time for unexpected demands</li><li>Learn to say NO to non-essential requests</li><li>Use planners, calendars, and to-do lists</li></ul>
<h4>Social Support Networks</h4>
<p>One of the most powerful stress buffers known to science:</p>
<ul><li>Sharing problems reduces the emotional load</li><li>Feeling valued and not alone lowers cortisol</li><li>Social support improves recovery from illness</li><li>Online communities supplement (but should not replace) face-to-face connection</li></ul>`},

{tag:'Psychology',tc:'#fde68a',title:'Self-Esteem, Locus of Control, Resiliency & Hardiness',q:'Explain the concepts of self-esteem, locus of control, resiliency, and hardiness in relation to stress management.',ans:`
<h4>Self-Esteem</h4>
<ul><li><span class="hl">High self-esteem</span> — Believe you can handle challenges. Less anxious, more confident, recovers faster from setbacks</li><li><span class="hl">Low self-esteem</span> — Negative self-talk, feels overwhelmed, avoids challenges</li></ul>
<p>Self-esteem is built through small successes, positive affirmations, and compassionate self-talk.</p>
<h4>Locus of Control <span class="hl">Rotter</span></h4>
<ul><li><strong>Internal locus</strong> — "I control my outcomes." Takes responsibility, proactive, less stressed</li><li><strong>External locus</strong> — "Things happen TO me." Feels helpless, blames luck or others, more stressed</li></ul>
<h4>Resiliency</h4>
<p>The ability to bounce back from adversity and stress. Resilient people:</p>
<ul><li>View setbacks as temporary and changeable</li><li>Learn and grow from difficulties</li><li>Maintain optimism and seek support without shame</li></ul>
<h4>Hardiness <span class="hl">Kobasa</span> — The 3 C's</h4>
<ul><li><strong>Commitment</strong> — Engaged in life, finds purpose and meaning</li><li><strong>Control</strong> — Believes actions influence outcomes</li><li><strong>Challenge</strong> — Views change as opportunity, not threat</li></ul>
<p>High hardiness = natural protection against stress-related illness.</p>`},

{tag:'Wellbeing',tc:'#c4b5fd',title:'Spirituality, Religion, Forgiveness & Volunteerism',q:'Discuss the role of spirituality, religion, forgiveness, and volunteerism in promoting health and reducing stress.',ans:`
<h4>Spirituality</h4>
<p>Having a sense of meaning, purpose, and connection to something greater. Even non-religious spirituality (connection to nature, values, the universe) reduces stress by providing:</p>
<ul><li>A sense of purpose and direction in life</li><li>Inner peace and acceptance of what cannot be changed</li><li>Hope during deeply difficult times</li></ul>
<h4>Religion</h4>
<p>Religious practice provides prayer, rituals, community, and a moral framework. Research consistently shows religious people report:</p>
<ul><li>Lower anxiety, depression, and loneliness</li><li>Better health outcomes and longer life</li><li>Stronger social support networks</li><li>Greater resilience after trauma</li></ul>
<h4>Forgiveness</h4>
<p>Holding grudges keeps stress alive in your body — elevated cortisol, chronic anger, and rumination. Forgiveness means:</p>
<ul><li>Releasing resentment (not excusing the harmful act)</li><li>Freeing yourself from the emotional burden</li><li>Reducing blood pressure, anxiety, and cortisol</li></ul>
<h4>Volunteerism</h4>
<p>Helping others shifts focus from your own problems. It releases <span class="hl">oxytocin</span> (the "helper's high"), increases sense of purpose, reduces depression, and improves self-esteem and social connection.</p>`},

{tag:'Relaxation',tc:'#7dd3fc',title:'Relaxation Techniques & Their Benefits',q:'Explain relaxation techniques such as meditation, yoga, progressive relaxation, and diaphragmatic breathing.',ans:`
<h4>Meditation</h4>
<p>Sitting quietly, focusing on breath or a mantra, letting thoughts pass without judgment. Even 10 minutes daily:</p>
<ul><li>Reduces cortisol levels significantly</li><li>Lowers blood pressure and heart rate</li><li>Improves focus, sleep, and emotional stability</li><li>Builds gray matter in stress-regulating brain areas</li></ul>
<h4>Yoga</h4>
<p>Combines physical postures, breath control, and mindfulness:</p>
<ul><li>Releases muscle tension held by stress</li><li>Activates the parasympathetic (calm) nervous system</li><li>Effective for anxiety, depression, and chronic pain</li></ul>
<h4>Progressive Muscle Relaxation (PMR) <span class="hl">Jacobson</span></h4>
<p>Systematically tense then release each muscle group from feet to face. Teaches the nervous system what deep relaxation feels like. Excellent for insomnia, tension headaches, and pre-performance anxiety.</p>
<h4>Diaphragmatic (Deep) Breathing</h4>
<p>Breathe deeply into the belly, not the chest. Slow breaths activate the vagus nerve and parasympathetic system — calming the body within minutes.</p>
<p>Try the <span class="hl">4-7-8 technique</span>: Inhale for 4 counts, hold for 7, exhale for 8. Immediate stress relief, lowers blood pressure, reduces anxiety.</p>`},

{tag:'Mindfulness',tc:'#bbf7d0',title:'Mindfulness, Music, Tai Chi, Exercise & Healthy Lifestyle',q:'Describe mindfulness, music therapy, Tai Chi, exercise, and healthy lifestyle behaviors in stress reduction.',ans:`
<h4>Mindfulness</h4>
<p>Paying full, non-judgmental attention to the present moment — stops the mental time-travel (ruminating about past, worrying about future) that drives most stress.</p>
<ul><li>Mindful eating, walking, breathing, listening</li><li>MBSR (Mindfulness-Based Stress Reduction) — evidence-based 8-week program</li><li>Reduces anxiety, depression, chronic pain, and burnout</li></ul>
<h4>Music Therapy</h4>
<ul><li>Slow, calming music (60 BPM) synchronizes with heart rate</li><li>Reduces cortisol and lowers blood pressure</li><li>Elevates mood via dopamine release</li><li>Used in hospitals, surgery recovery, and trauma therapy</li></ul>
<h4>Tai Chi — "Meditation in Motion"</h4>
<p>Ancient Chinese martial art of slow, flowing movements with breath awareness. Reduces stress, improves balance and flexibility, calms the nervous system. Especially effective for older adults.</p>
<h4>Exercise</h4>
<ul><li>Releases endorphins — natural mood elevators</li><li>Burns off excess cortisol and adrenaline</li><li>Improves sleep quality significantly</li><li>Even a 30-minute brisk walk helps</li></ul>
<h4>Healthy Lifestyle Behaviors</h4>
<ul><li>7–9 hours of quality sleep (sleep deprivation multiplies stress)</li><li>Balanced nutrition and adequate hydration</li><li>Limiting caffeine, alcohol; avoiding smoking</li><li>Regular social connection and time in nature</li></ul>`},

{tag:'Workplace',tc:'#fdba74',title:'Occupational Stress, Burnout & the Stress Cycle',q:'Explain occupational stress, burnout, and the stress cycle. Discuss suitable methods for managing occupational stress.',ans:`
<h4>Occupational Stress</h4>
<p>Work-related stress arising from:</p>
<ul><li>Excessive workload and impossible deadlines</li><li>Lack of control or autonomy over work</li><li>Poor management, bullying, or toxic culture</li><li>Job insecurity and fear of redundancy</li><li>Role ambiguity — unclear job expectations</li><li>Work-life imbalance</li></ul>
<h4>Burnout <span class="hl">Maslach</span> — 3 Defining Signs</h4>
<ul><li><strong>Exhaustion</strong> — Physically and emotionally drained, no energy</li><li><strong>Cynicism/Depersonalization</strong> — Detached, stopped caring about work or colleagues</li><li><strong>Reduced Efficacy</strong> — Feeling incompetent, nothing feels worthwhile</li></ul>
<h4>The Stress Cycle</h4>
<p><span class="hl">Stressor → Perception → Stress Response → Coping → Recovery (or Burnout)</span></p>
<p>If the cycle is never completed — stress never resolved, body never calms — it becomes chronic, leading to burnout, illness, and breakdown.</p>
<h4>Managing Occupational Stress</h4>
<ul><li>Set firm work-life boundaries (no work messages after hours)</li><li>Take regular micro-breaks during the workday</li><li>Communicate openly with managers about workload</li><li>Delegate tasks — you don't have to do everything</li><li>Use Employee Assistance Programs (EAPs)</li><li>Practice daily relaxation techniques</li><li>Take full vacations with real disconnection</li></ul>`}
];

// ── STATE ──
let cur=0;

// ── INIT ──
(function(){
  const dt=document.getElementById('dots');
  for(let i=0;i<15;i++){
    const d=document.createElement('button');
    d.className='dot';
    d.onclick=()=>{cur=i;render()};
    d.title=`Q${i+1}: ${QS[i].title}`;
    dt.appendChild(d);
  }
})();

function startJourney(){
  const sp=document.getElementById('splash');
  sp.classList.add('gone');
  setTimeout(()=>{
    sp.style.display='none';
    ['hdr','main','nav','parea'].forEach(id=>document.getElementById(id).style.display='');
    document.getElementById('hdr').style.display='flex';
    document.getElementById('main').style.display='flex';
    document.getElementById('nav').style.display='flex';
    buildMilestones();
    render();
  },820);
}

function buildMilestones(){
  const c=document.getElementById('mss');
  c.innerHTML='';
  for(let i=0;i<15;i++){
    const m=document.createElement('div');
    m.className='ms';
    m.style.left=`${4+(i/14)*88}%`;
    m.title=`Q${i+1}: ${QS[i].title}`;
    m.onclick=()=>{cur=i;render()};
    m.style.pointerEvents='all';
    c.appendChild(m);
  }
}

function render(){
  renderScene();
  renderContent();
  renderProgress();
  updateWalker();
  document.getElementById('pb').disabled=cur===0;
  document.getElementById('nb').disabled=cur===14;
}

function renderScene(){
  const sc=SCENES[cur];
  const el=document.getElementById('scene');
  el.style.background=sc.bg;
  el.innerHTML='';
  sc.decos.forEach(d=>{
    const div=document.createElement('div');
    div.className=`deco ${d.an}`;
    div.style.cssText=`width:${d.w}px;height:${d.h}px;top:${d.t};left:${d.l};border-radius:${d.br};background:${d.border?'transparent':d.cl};--op:${d.op};opacity:${d.op};animation-delay:${d.d||0}s;${d.border?'border:'+d.border+';':''}`;
    el.appendChild(div);
  });
}

function renderContent(){
  const q=QS[cur];
  const card=document.getElementById('card');
  card.style.setProperty('--acc',q.tc);
  const old=card.querySelector('.ci');
  if(old)old.remove();
  const ci=document.createElement('div');
  ci.className='ci';
  ci.innerHTML=`<div class="tag" style="background:${q.tc}1a;color:${q.tc};border:1px solid ${q.tc}40">${q.tag}</div>
<h2 class="qtitle">Q${String(cur+1).padStart(2,'0')}: ${q.title}</h2>
<div class="qtext">${q.q}</div>
<div class="ans">${q.ans}</div>`;
  card.appendChild(ci);
  card.scrollTop=0;
  if(cur===14) setTimeout(showConfetti,600);
}

function renderProgress(){
  document.getElementById('pf').style.width=((cur+1)/15*100).toFixed(1)+'%';
  document.getElementById('ql').textContent=`${cur+1}/15`;
  const dots=document.getElementById('dots').children;
  const mss=document.getElementById('mss').children;
  for(let i=0;i<15;i++){
    dots[i].className='dot'+(i===cur?' active':i<cur?' done':'');
    mss[i].className='ms'+(i===cur?' now':i<cur?' done':'');
  }
  document.getElementById('pdone').style.width=`${(cur/14)*100}%`;
}

function updateWalker(){
  const pct=4+(cur/14)*88;
  document.getElementById('walker').style.left=`calc(${pct}% - 22px)`;
}

function go(dir){
  cur=Math.max(0,Math.min(14,cur+dir));
  render();
}

function showConfetti(){
  const colors=['#f87171','#a78bfa','#4ade80','#60a5fa','#fbbf24','#f9a8d4','#86efac'];
  for(let i=0;i<45;i++){
    const c=document.createElement('div');
    c.className='conf';
    const sz=Math.random()*8+6;
    c.style.cssText=`width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;top:-10px;border-radius:${Math.random()>.5?'50%':'2px'};animation:confDrop ${1.5+Math.random()*1.5}s ease-in ${Math.random()*0.8}s forwards`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('splash').style.display==='none'||document.getElementById('splash').classList.contains('gone')){
    if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);
  }
});
</script>
</body>
</html>
